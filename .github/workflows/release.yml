name: Auto-Version & Android Release Build

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Bump Version
        id: version_bump
        run: |
          # Read current version
          OLD_VERSION=$(node -p "require('./package.json').version")
          echo "Old Version: $OLD_VERSION"
          
          # Bump patch version in package.json
          npm version patch --no-git-tag-version
          
          # Read new version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "New Version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Commit and Push Version Bump
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add package.json
          git commit -m "chore(release): bump version to v${{ steps.version_bump.outputs.version }} [skip ci]"
          git push origin main

      - name: Build Web Frontend
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version_bump.outputs.version }}
          name: Release v${{ steps.version_bump.outputs.version }}
          body: |
            Automated build for Sentinel ID Verifier v${{ steps.version_bump.outputs.version }}.
            
            ### Artifacts Included
            * **app-debug.apk**: Android installation file (debug configuration).
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
